# Baseline generated by apivzero/gh-repo-standards (MODE=dependabot).
# Weekly updates; minor and patch grouped per ecosystem, majors as separate PRs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]
